<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Archivo Black", sans-serif;
          color: #f2ece1;
          background: transparent;
        }
        .mo-wipe {
          position: absolute;
          inset: 0;
          background: #0b0908;
          z-index: 45;
          transform: translateX(0%);
        }
        .mo-glitch-bar {
          position: absolute;
          left: 0;
          right: 0;
          height: 26px;
          background: #ff8a1e;
          opacity: 0;
          z-index: 46;
        }
        /* ---- Depth layer: blurred parallax echo of the subject area, drifts slower ---- */
        .mo-parallax-glow {
          position: absolute;
          left: -10%;
          top: -6%;
          width: 120%;
          height: 60%;
          z-index: 3;
          background: radial-gradient(ellipse at 55% 30%, rgba(255, 178, 102, 0.22) 0%, rgba(255, 178, 102, 0) 60%);
          filter: blur(6px);
          pointer-events: none;
        }
        .mo-vignette {
          position: absolute;
          inset: 0;
          z-index: 6;
          pointer-events: none;
          background: radial-gradient(ellipse at 50% 40%, rgba(11, 9, 8, 0) 36%, rgba(11, 9, 8, 0.66) 100%);
        }
        .mo-grade {
          position: absolute;
          inset: 0;
          z-index: 4;
          pointer-events: none;
          background: linear-gradient(180deg, rgba(255, 138, 30, 0.12) 0%, rgba(11, 9, 8, 0) 30%, rgba(11, 9, 8, 0.38) 100%);
        }
        /* ---- Specular light sweep across the mirror ---- */
        .mo-specular {
          position: absolute;
          top: -10%;
          width: 360px;
          height: 130%;
          background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 235, 210, 0.22) 48%, rgba(255, 255, 255, 0) 100%);
          z-index: 7;
          transform: translateX(-700px) skewX(-12deg);
          pointer-events: none;
        }
        /* ---- Steam / condensation motes drifting up ---- */
        .mo-mote {
          position: absolute;
          border-radius: 50%;
          background: rgba(242, 236, 225, 0.5);
          filter: blur(2px);
          z-index: 8;
          opacity: 0;
          pointer-events: none;
        }
        /* ---- Self-drawing corner frame around the subject ---- */
        .mo-bracket {
          position: absolute;
          width: 110px;
          height: 110px;
          z-index: 9;
          pointer-events: none;
        }
        .mo-bracket span {
          position: absolute;
          background: #ff8a1e;
        }
        .mo-bracket .h {
          width: 100%;
          height: 5px;
          top: 0;
          transform-origin: left center;
          transform: scaleX(0);
        }
        .mo-bracket .v {
          height: 100%;
          width: 5px;
          left: 0;
          transform-origin: top center;
          transform: scaleY(0);
        }
        .mo-bracket.tl { left: 220px; top: 980px; }
        .mo-bracket.tr { right: 220px; top: 980px; }
        .mo-bracket.tr .h { transform-origin: right center; }
        .mo-bracket.tr span.v { left: auto; right: 0; transform-origin: top center; }
        .mo-bracket.bl { left: 220px; bottom: 760px; }
        .mo-bracket.bl .h { top: auto; bottom: 0; }
        .mo-bracket.bl .v { transform-origin: bottom center; }
        .mo-bracket.br { right: 220px; bottom: 760px; }
        .mo-bracket.br .h { top: auto; bottom: 0; transform-origin: right center; }
        .mo-bracket.br span.v { left: auto; right: 0; transform-origin: bottom center; }

        .mo-top-meta {
          position: absolute;
          top: 280px;
          left: 96px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          font-size: 34px;
          letter-spacing: 0.12em;
          color: #f2ece1;
          opacity: 0;
        }
        .mo-headline {
          position: absolute;
          left: 96px;
          bottom: 980px;
          z-index: 10;
          font-size: 124px;
          line-height: 0.96;
          letter-spacing: -0.03em;
        }
        .mo-headline span.line {
          display: block;
        }
        .mo-headline .accent {
          color: #ff8a1e;
        }
        .mo-sub {
          position: absolute;
          left: 100px;
          bottom: 880px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          font-size: 36px;
          letter-spacing: 0.04em;
          color: #f2ece1;
          opacity: 0.85;
        }
        .mo-rule {
          position: absolute;
          left: 96px;
          bottom: 850px;
          width: 0;
          height: 5px;
          background: #ff8a1e;
          z-index: 10;
        }
        .mo-stat-row {
          position: absolute;
          right: 96px;
          bottom: 850px;
          z-index: 10;
          text-align: right;
          font-family: "JetBrains Mono", monospace;
          color: #f2ece1;
          opacity: 0;
        }
        .mo-stat-row .big {
          font-size: 70px;
          font-weight: 700;
          color: #ff8a1e;
        }
        .mo-stat-row .small {
          font-size: 28px;
          letter-spacing: 0.08em;
          opacity: 0.75;
        }
        .mo-badge {
          position: absolute;
          top: 280px;
          right: 96px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          letter-spacing: 0.1em;
          color: #0b0908;
          background: #f2ece1;
          padding: 14px 28px;
          opacity: 0;
          transform: scale(0.7);
        }
        .mo-side-ticks {
          position: absolute;
          left: 96px;
          top: 50%;
          transform: translateY(-50%);
          display: flex;
          flex-direction: column;
          gap: 16px;
          z-index: 10;
        }
        .mo-side-ticks .tick {
          width: 50px;
          height: 4px;
          background: #f2ece1;
          opacity: 0;
          transform-origin: left center;
        }
      </style>
      <div id="root" data-composition-id="sc-morning" data-width="2160" data-height="3840">
        <div class="mo-parallax-glow" id="mo-parallax" data-layout-allow-overflow></div>
        <div class="mo-grade"></div>
        <div class="mo-specular" id="mo-specular"></div>
        <div class="mo-vignette"></div>

        <!-- atmospheric steam motes, deterministic positions -->
        <div class="mo-mote" id="mo-m1" style="left: 18%; bottom: 12%; width: 22px; height: 22px;"></div>
        <div class="mo-mote" id="mo-m2" style="left: 64%; bottom: 8%; width: 16px; height: 16px;"></div>
        <div class="mo-mote" id="mo-m3" style="left: 40%; bottom: 20%; width: 28px; height: 28px;"></div>
        <div class="mo-mote" id="mo-m4" style="left: 76%; bottom: 30%; width: 18px; height: 18px;"></div>
        <div class="mo-mote" id="mo-m5" style="left: 28%; bottom: 36%; width: 14px; height: 14px;"></div>
        <div class="mo-mote" id="mo-m6" style="left: 55%; bottom: 16%; width: 20px; height: 20px;"></div>

        <!-- self-drawing frame around the subject -->
        <div class="mo-bracket tl" id="mo-bk-tl"><span class="h"></span><span class="v"></span></div>
        <div class="mo-bracket tr" id="mo-bk-tr"><span class="h"></span><span class="v"></span></div>
        <div class="mo-bracket bl" id="mo-bk-bl"><span class="h"></span><span class="v"></span></div>
        <div class="mo-bracket br" id="mo-bk-br"><span class="h"></span><span class="v"></span></div>

        <div class="mo-badge mono" id="mo-badge">FASE 01 / 06</div>
        <div class="mo-top-meta mono" id="mo-meta">CAM 01 · INTERNO BAGNO</div>

        <div class="mo-side-ticks" id="mo-ticks">
          <div class="tick"></div>
          <div class="tick"></div>
          <div class="tick"></div>
          <div class="tick"></div>
        </div>

        <div class="mo-headline" id="mo-headline"><span class="line">06:30</span><span class="line accent">MATTINA</span></div>
        <div class="mo-sub mono" id="mo-sub">RITUALE DI PARTENZA — SI PARTE.</div>
        <div class="mo-rule" id="mo-rule"></div>

        <div class="mo-stat-row" id="mo-stats">
          <div class="big" id="mo-stat-num">+1</div>
          <div class="small">GIORNO INIZIATO</div>
        </div>

        <div class="mo-glitch-bar" id="mo-bar1" style="top: 30%;"></div>
        <div class="mo-glitch-bar" id="mo-bar2" style="top: 62%;"></div>
        <div class="mo-wipe" id="mo-wipe" data-layout-allow-overflow></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const D = 4.19;

        // ---- Transition IN: glitch bars flash, then wipe slides off (whip feel) ----
        tl.to("#mo-bar1", { opacity: 0.9, duration: 0.05 }, 0);
        tl.to("#mo-bar1", { opacity: 0, duration: 0.05 }, 0.07);
        tl.to("#mo-bar2", { opacity: 0.9, duration: 0.05 }, 0.05);
        tl.to("#mo-bar2", { opacity: 0, duration: 0.05 }, 0.12);
        tl.to("#mo-wipe", { x: "-100%", duration: 0.42, ease: "power4.inOut" }, 0.08);
        tl.set("#mo-wipe", { display: "none" }, 0.5);

        // ---- Depth: parallax glow drifts opposite direction to the host Ken Burns push ----
        tl.fromTo(
          "#mo-parallax",
          { x: 40, y: -20, scale: 1.1, opacity: 0 },
          { x: -70, y: 30, scale: 1.25, opacity: 1, duration: D, ease: "sine.inOut" },
          0,
        );

        // ---- Specular sweep crosses the mirror once, like reflected light ----
        tl.fromTo(
          "#mo-specular",
          { x: -700, opacity: 0 },
          { x: 2400, opacity: 1, duration: 1.6, ease: "sine.inOut" },
          0.5,
        );
        tl.to("#mo-specular", { opacity: 0, duration: 0.3, overwrite: "auto" }, 1.9);

        // ---- Self-drawing frame brackets open around the subject ----
        const brackets = ["#mo-bk-tl", "#mo-bk-tr", "#mo-bk-bl", "#mo-bk-br"];
        brackets.forEach((sel, i) => {
          tl.to(`${sel} .h`, { scaleX: 1, duration: 0.32, ease: "power3.out" }, 0.15 + i * 0.05);
          tl.to(`${sel} .v`, { scaleY: 1, duration: 0.32, ease: "power3.out" }, 0.15 + i * 0.05);
        });

        // ---- Steam motes drift upward and fade, staggered, looping across the scene ----
        const motes = ["#mo-m1", "#mo-m2", "#mo-m3", "#mo-m4", "#mo-m5", "#mo-m6"];
        motes.forEach((sel, i) => {
          const rise = 260 + (i % 3) * 60;
          const dur = 2.6 + (i % 4) * 0.4;
          const start = 0.2 + i * 0.28;
          tl.fromTo(
            sel,
            { y: 0, x: 0, opacity: 0, scale: 0.8 },
            { opacity: 0.5, duration: 0.5, ease: "sine.out" },
            start,
          );
          tl.to(sel, { y: -rise, x: i % 2 === 0 ? 30 : -30, scale: 1.3, opacity: 0, duration: dur, ease: "sine.inOut" }, start);
        });

        // ---- Entrances (distinct per element, staggered) ----
        tl.fromTo(
          "#mo-badge",
          { opacity: 0, scale: 0.7 },
          { opacity: 0.9, scale: 1, duration: 0.4, ease: "back.out(2)" },
          0.4,
        );
        tl.fromTo("#mo-meta", { opacity: 0, x: -40 }, { opacity: 0.75, x: 0, duration: 0.4, ease: "power2.out" }, 0.5);

        tl.fromTo(
          "#mo-headline",
          { y: 140, opacity: 0, filter: "blur(14px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.65, ease: "power3.out" },
          0.55,
        );
        tl.fromTo("#mo-sub", { opacity: 0, x: -30 }, { opacity: 0.85, x: 0, duration: 0.4, ease: "power2.out" }, 0.85);
        tl.fromTo("#mo-rule", { width: 0 }, { width: 320, duration: 0.5, ease: "power3.out" }, 0.9);

        tl.fromTo(
          "#mo-stats",
          { opacity: 0, y: -20 },
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
          1.0,
        );

        const ticks = gsap.utils.toArray("#mo-ticks .tick");
        ticks.forEach((t, i) => {
          tl.fromTo(t, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 0.6, duration: 0.3, ease: "power2.out" }, 0.6 + i * 0.08);
        });

        // ---- Ambient holds across the rest of the scene ----
        tl.to("#mo-ticks .tick", { opacity: 0.3, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.4);
        tl.to("#mo-rule", { opacity: 0.6, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.6);

        window.__timelines["sc-morning"] = tl;
      </script>
    </template>
  </body>
</html>
