<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Archivo Black", sans-serif;
          color: #f2ece1;
          background: transparent;
        }
        .ni-wipe {
          position: absolute;
          inset: 0;
          background: #0b0908;
          z-index: 50;
          transform: translateY(0%);
        }
        /* ---- Depth: parallax neon glow layer drifting opposite to host image pan ---- */
        .ni-parallax {
          position: absolute;
          left: -10%;
          top: 10%;
          width: 120%;
          height: 55%;
          z-index: 3;
          background: radial-gradient(ellipse at 60% 40%, rgba(46, 196, 182, 0.18) 0%, rgba(46, 196, 182, 0) 60%);
          filter: blur(5px);
          pointer-events: none;
        }
        .ni-grade {
          position: absolute;
          inset: 0;
          z-index: 5;
          pointer-events: none;
          background: linear-gradient(180deg, rgba(229, 56, 59, 0.14) 0%, rgba(11, 9, 8, 0.15) 40%, rgba(11, 9, 8, 0.65) 100%);
        }
        .ni-scan {
          position: absolute;
          left: 0;
          right: 0;
          height: 3px;
          background: rgba(46, 196, 182, 0.5);
          z-index: 7;
          opacity: 0;
        }
        /* ---- Bokeh light streaks drifting across the dark frame (oncoming lights) ---- */
        .ni-bokeh {
          position: absolute;
          border-radius: 50%;
          z-index: 6;
          opacity: 0;
          pointer-events: none;
          filter: blur(1px);
        }
        /* ---- Moving specular sweep across the dash glass ---- */
        .ni-specular {
          position: absolute;
          top: 1000px;
          width: 300px;
          height: 700px;
          background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(180, 230, 225, 0.18) 50%, rgba(255, 255, 255, 0) 100%);
          z-index: 7;
          transform: translateX(-600px) skewX(-14deg);
          pointer-events: none;
        }
        /* ---- Self-drawing HUD corner frame ---- */
        .ni-bracket {
          position: absolute;
          width: 100px;
          height: 100px;
          z-index: 9;
          pointer-events: none;
        }
        .ni-bracket span {
          position: absolute;
          background: #2ec4b6;
        }
        .ni-bracket .h {
          width: 100%;
          height: 4px;
          top: 0;
          transform-origin: left center;
          transform: scaleX(0);
        }
        .ni-bracket .v {
          height: 100%;
          width: 4px;
          left: 0;
          transform-origin: top center;
          transform: scaleY(0);
        }
        .ni-bracket.tl { left: 110px; top: 1080px; }
        .ni-bracket.tr { right: 110px; top: 1080px; }
        .ni-bracket.tr .h { transform-origin: right center; }
        .ni-bracket.tr span.v { left: auto; right: 0; transform-origin: top center; }
        .ni-bracket.bl { left: 110px; bottom: 200px; }
        .ni-bracket.bl .h { top: auto; bottom: 0; }
        .ni-bracket.bl .v { transform-origin: bottom center; }
        .ni-bracket.br { right: 110px; bottom: 200px; }
        .ni-bracket.br .h { top: auto; bottom: 0; transform-origin: right center; }
        .ni-bracket.br span.v { left: auto; right: 0; transform-origin: bottom center; }

        .ni-headline {
          position: absolute;
          left: 96px;
          top: 420px;
          z-index: 10;
          font-size: 116px;
          line-height: 0.96;
          letter-spacing: -0.03em;
        }
        .ni-headline .accent {
          color: #2ec4b6;
        }
        .ni-sub {
          position: absolute;
          left: 100px;
          top: 720px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          font-size: 36px;
          opacity: 0;
        }
        .ni-badge {
          position: absolute;
          top: 420px;
          right: 96px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          letter-spacing: 0.1em;
          color: #0b0908;
          background: #f2ece1;
          padding: 14px 28px;
          opacity: 0;
          transform: scale(0.7);
        }
        .ni-hud-panel {
          position: absolute;
          left: 96px;
          bottom: 520px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          border-left: 4px solid #2ec4b6;
          padding-left: 28px;
          opacity: 0;
        }
        .ni-hud-panel .speed {
          font-size: 96px;
          color: #2ec4b6;
          line-height: 1;
        }
        .ni-hud-panel .unit {
          font-size: 28px;
          opacity: 0.7;
          letter-spacing: 0.1em;
        }
        .ni-track-panel {
          position: absolute;
          right: 96px;
          bottom: 540px;
          z-index: 10;
          text-align: right;
          font-family: "JetBrains Mono", monospace;
          opacity: 0;
        }
        .ni-track-panel .now-playing {
          font-size: 24px;
          opacity: 0.6;
          letter-spacing: 0.15em;
        }
        .ni-track-panel .track {
          font-size: 38px;
          color: #f2ece1;
          margin-top: 6px;
        }
        .ni-track-panel .artist {
          font-size: 28px;
          opacity: 0.7;
        }
        .ni-eq {
          display: flex;
          gap: 6px;
          justify-content: flex-end;
          margin-top: 14px;
        }
        .ni-eq .bar {
          width: 8px;
          height: 20px;
          background: #2ec4b6;
          opacity: 0.7;
          transform-origin: bottom center;
        }
        .ni-bottom-rule {
          position: absolute;
          left: 96px;
          right: 96px;
          bottom: 320px;
          height: 3px;
          background: rgba(242, 236, 225, 0.22);
          z-index: 10;
          transform-origin: left center;
          transform: scaleX(0);
        }
        .ni-time-meta {
          position: absolute;
          left: 96px;
          bottom: 240px;
          z-index: 10;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          opacity: 0;
          letter-spacing: 0.08em;
        }
      </style>
      <div id="root" data-composition-id="sc-night" data-width="2160" data-height="3840">
        <div class="ni-parallax" id="ni-parallax"></div>
        <div class="ni-grade"></div>
        <div class="ni-specular" id="ni-specular"></div>
        <div class="ni-scan" id="ni-scan" style="top: 1200px;"></div>

        <!-- bokeh light streaks, deterministic positions -->
        <div class="ni-bokeh" id="ni-b1" style="left: 12%; top: 20%; width: 30px; height: 30px; background: rgba(229,56,59,0.55); box-shadow: 0 0 30px 10px rgba(229,56,59,0.4);"></div>
        <div class="ni-bokeh" id="ni-b2" style="left: 80%; top: 14%; width: 22px; height: 22px; background: rgba(242,236,225,0.55); box-shadow: 0 0 24px 8px rgba(242,236,225,0.35);"></div>
        <div class="ni-bokeh" id="ni-b3" style="left: 65%; top: 30%; width: 18px; height: 18px; background: rgba(46,196,182,0.5); box-shadow: 0 0 20px 8px rgba(46,196,182,0.4);"></div>
        <div class="ni-bokeh" id="ni-b4" style="left: 30%; top: 26%; width: 14px; height: 14px; background: rgba(242,236,225,0.45); box-shadow: 0 0 16px 6px rgba(242,236,225,0.3);"></div>

        <div class="ni-bracket tl" id="ni-bk-tl"><span class="h"></span><span class="v"></span></div>
        <div class="ni-bracket tr" id="ni-bk-tr"><span class="h"></span><span class="v"></span></div>
        <div class="ni-bracket bl" id="ni-bk-bl"><span class="h"></span><span class="v"></span></div>
        <div class="ni-bracket br" id="ni-bk-br"><span class="h"></span><span class="v"></span></div>

        <div class="ni-badge mono" id="ni-badge">FASE 05 / 06</div>
        <div class="ni-headline" id="ni-headline">23:10<br /><span class="accent">ON THE ROAD</span></div>
        <div class="ni-sub mono" id="ni-sub">RIENTRO — STRADA COSTIERA</div>

        <div class="ni-hud-panel" id="ni-hud">
          <div class="speed mono" id="ni-speed">76</div>
          <div class="unit mono">KM/H · MODALITÀ NOTTE</div>
        </div>

        <div class="ni-track-panel" id="ni-track">
          <div class="now-playing mono">IN RIPRODUZIONE</div>
          <div class="track mono">S&amp;M</div>
          <div class="artist mono">Rihanna</div>
          <div class="ni-eq" id="ni-eq">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>

        <div class="ni-bottom-rule" id="ni-bottom-rule"></div>
        <div class="ni-time-meta mono" id="ni-time-meta">28 KM ALLA META · ARRIVO 23:34</div>

        <div class="ni-wipe" id="ni-wipe"></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Transition IN: vertical push (editorial direction change, topic-change feel) ----
        tl.fromTo("#ni-wipe", { yPercent: 0 }, { yPercent: -100, duration: 0.45, ease: "power3.inOut" }, 0);
        tl.set("#ni-wipe", { display: "none" }, 0.45);

        // ---- Depth: parallax glow drifts at a different rate than the host image push ----
        tl.fromTo(
          "#ni-parallax",
          { x: 50, opacity: 0, scale: 1 },
          { x: -60, opacity: 1, scale: 1.15, duration: 5.5, ease: "sine.inOut" },
          0,
        );

        // ---- Specular sweep across the dash glass, once ----
        tl.fromTo("#ni-specular", { x: -600, opacity: 0 }, { x: 2200, opacity: 1, duration: 1.4, ease: "sine.inOut" }, 0.6);
        tl.to("#ni-specular", { opacity: 0, duration: 0.3 }, 2.0);

        // ---- Bokeh streaks drift across like passing lights, staggered loops ----
        const bokehs = ["#ni-b1", "#ni-b2", "#ni-b3", "#ni-b4"];
        bokehs.forEach((sel, i) => {
          const dur = 2.0 + (i % 3) * 0.4;
          const start = 0.3 + i * 0.5;
          tl.fromTo(sel, { x: 0, opacity: 0, scale: 0.7 }, { opacity: 0.9, duration: 0.4, ease: "sine.out" }, start);
          tl.to(sel, { x: i % 2 === 0 ? -260 : 260, y: 40, scale: 1.3, opacity: 0, duration: dur, ease: "sine.inOut" }, start);
        });
        bokehs.forEach((sel, i) => {
          const dur = 1.8 + (i % 3) * 0.3;
          const start = 3.2 + i * 0.4;
          tl.fromTo(sel, { x: 0, opacity: 0, scale: 0.7 }, { opacity: 0.8, duration: 0.4, ease: "sine.out", overwrite: "auto" }, start);
          tl.to(sel, { x: i % 2 === 0 ? -220 : 220, y: 30, scale: 1.2, opacity: 0, duration: dur, ease: "sine.inOut", overwrite: "auto" }, start);
        });

        // ---- Self-drawing HUD frame brackets open ----
        const brackets = ["#ni-bk-tl", "#ni-bk-tr", "#ni-bk-bl", "#ni-bk-br"];
        brackets.forEach((sel, i) => {
          tl.to(`${sel} .h`, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.5 + i * 0.05);
          tl.to(`${sel} .v`, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 0.5 + i * 0.05);
        });

        tl.fromTo(
          "#ni-badge",
          { opacity: 0, scale: 0.7 },
          { opacity: 0.9, scale: 1, duration: 0.4, ease: "back.out(2)" },
          0.45,
        );
        tl.fromTo(
          "#ni-headline",
          { y: -120, opacity: 0, filter: "blur(12px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          0.52,
        );
        tl.fromTo("#ni-sub", { opacity: 0, x: -30 }, { opacity: 0.85, x: 0, duration: 0.4, ease: "power2.out" }, 0.8);

        tl.fromTo(
          "#ni-hud",
          { opacity: 0, x: -40 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
          1.0,
        );
        // speed counts up from 0 to 76 (deterministic counting rule)
        tl.fromTo(
          "#ni-speed",
          { textContent: 0 },
          { textContent: 76, duration: 0.9, ease: "power2.out", snap: { textContent: 1 } },
          1.05,
        );

        tl.fromTo(
          "#ni-track",
          { opacity: 0, x: 40 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
          1.3,
        );

        // EQ bars pulse like a playing track — finite, deterministic per-bar cycles
        const bars = gsap.utils.toArray("#ni-eq .bar");
        bars.forEach((b, i) => {
          tl.to(
            b,
            {
              scaleY: 1.8 + (i % 3) * 0.4,
              duration: 0.28 + i * 0.02,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 9,
            },
            1.6 + i * 0.05,
          );
        });

        tl.fromTo("#ni-bottom-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 1.5);
        tl.fromTo("#ni-time-meta", { opacity: 0, y: 16 }, { opacity: 0.65, y: 0, duration: 0.4, ease: "power2.out" }, 1.7);

        // scanline ambient sweep
        tl.fromTo("#ni-scan", { y: -1100, opacity: 0.5 }, { y: 1100, duration: 3.2, ease: "none", repeat: 0 }, 1.9);

        window.__timelines["sc-night"] = tl;
      </script>
    </template>
  </body>
</html>
