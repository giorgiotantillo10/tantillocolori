<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Archivo Black", sans-serif;
          color: #f2ece1;
          background: transparent;
        }
        .wk-bg-panel {
          position: absolute;
          inset: 0;
          z-index: 1;
          background: #11100d;
        }
        .wk-ghost {
          position: absolute;
          left: -120px;
          top: 60px;
          font-size: 420px;
          line-height: 1;
          color: #f2ece1;
          opacity: 0.04;
          z-index: 1;
          letter-spacing: -0.04em;
        }
        /* ---- Depth: parallax amber glow drifting behind the bezel ---- */
        .wk-parallax {
          position: absolute;
          left: 10%;
          top: 20%;
          width: 90%;
          height: 50%;
          z-index: 2;
          background: radial-gradient(ellipse at 50% 50%, rgba(255, 138, 30, 0.16) 0%, rgba(255, 138, 30, 0) 62%);
          filter: blur(8px);
          pointer-events: none;
        }
        /* ---- Dust motes drifting in the desk-lamp light beam ---- */
        .wk-dust {
          position: absolute;
          border-radius: 50%;
          background: rgba(255, 200, 140, 0.55);
          z-index: 3;
          opacity: 0;
          pointer-events: none;
        }
        /* ---- Self-drawing frame brackets around the bezel ---- */
        .wk-bracket {
          position: absolute;
          width: 90px;
          height: 90px;
          z-index: 7;
          pointer-events: none;
        }
        .wk-bracket span {
          position: absolute;
          background: #ff8a1e;
        }
        .wk-bracket .h {
          width: 100%;
          height: 5px;
          top: 0;
          transform-origin: left center;
          transform: scaleX(0);
        }
        .wk-bracket .v {
          height: 100%;
          width: 5px;
          left: 0;
          transform-origin: top center;
          transform: scaleY(0);
        }
        .wk-bracket.tl { left: 190px; top: 1050px; }
        .wk-bracket.tr { right: 190px; top: 1050px; }
        .wk-bracket.tr .h { transform-origin: right center; }
        .wk-bracket.tr span.v { left: auto; right: 0; transform-origin: top center; }
        .wk-bracket.bl { left: 190px; bottom: 1130px; }
        .wk-bracket.bl .h { top: auto; bottom: 0; }
        .wk-bracket.bl .v { transform-origin: bottom center; }
        .wk-bracket.br { right: 190px; bottom: 1130px; }
        .wk-bracket.br .h { top: auto; bottom: 0; transform-origin: right center; }
        .wk-bracket.br span.v { left: auto; right: 0; transform-origin: bottom center; }
        .wk-wipe {
          position: absolute;
          inset: 0;
          background: #0b0908;
          z-index: 50;
          clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }
        /* Bezel/glow frame around the host video (positioned to match index.html video coords) */
        .wk-bezel {
          position: absolute;
          left: 220px;
          top: 1080px;
          width: 1720px;
          height: 1600px;
          z-index: 4;
          border: 6px solid #3a352c;
          border-radius: 28px;
          box-shadow: 0 0 0 14px #1a1814, 0 40px 120px rgba(0, 0, 0, 0.55), 0 0 160px rgba(255, 138, 30, 0.18);
          pointer-events: none;
        }
        .wk-scanline {
          position: absolute;
          left: 260px;
          top: 1120px;
          width: 1640px;
          height: 6px;
          background: linear-gradient(90deg, rgba(255, 138, 30, 0) 0%, rgba(255, 138, 30, 0.8) 50%, rgba(255, 138, 30, 0) 100%);
          z-index: 6;
          opacity: 0.7;
        }
        .wk-corner-tag {
          position: absolute;
          font-family: "JetBrains Mono", monospace;
          font-size: 28px;
          letter-spacing: 0.08em;
          color: #ff8a1e;
          z-index: 6;
          opacity: 0;
        }
        .wk-corner-tag span.line {
          display: block;
        }
        .wk-tag-tl {
          left: 250px;
          top: 1050px;
        }
        .wk-tag-tr {
          right: 250px;
          top: 1050px;
          text-align: right;
        }
        .wk-callout {
          position: absolute;
          z-index: 7;
          font-family: "JetBrains Mono", monospace;
          font-size: 32px;
          color: #f2ece1;
          background: rgba(11, 9, 8, 0.78);
          border: 2px solid #ff8a1e;
          padding: 16px 26px;
          opacity: 0;
          transform: scale(0.8);
        }
        .wk-callout-1 {
          left: 1740px;
          top: 1240px;
        }
        .wk-callout-2 {
          left: 1600px;
          top: 2280px;
        }
        .wk-callout-line {
          position: absolute;
          background: #ff8a1e;
          height: 2px;
          z-index: 6;
          transform-origin: left center;
          transform: scaleX(0);
        }
        .wk-line-1 {
          left: 1890px;
          top: 1320px;
          width: 80px;
        }
        .wk-line-2 {
          left: 1890px;
          top: 2360px;
          width: 80px;
        }
        .wk-headline span.line {
          display: block;
        }
        .wk-headline {
          position: absolute;
          left: 96px;
          top: 480px;
          z-index: 8;
          font-size: 124px;
          line-height: 0.96;
          letter-spacing: -0.03em;
        }
        .wk-headline .accent {
          color: #ff8a1e;
        }
        .wk-sub {
          position: absolute;
          left: 100px;
          top: 800px;
          z-index: 8;
          font-family: "JetBrains Mono", monospace;
          font-size: 36px;
          opacity: 0.85;
        }
        .wk-badge {
          position: absolute;
          top: 280px;
          right: 96px;
          z-index: 8;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          letter-spacing: 0.1em;
          color: #0b0908;
          background: #f2ece1;
          padding: 14px 28px;
          opacity: 0;
          transform: scale(0.7);
        }
        .wk-bottom-meta {
          position: absolute;
          left: 96px;
          bottom: 200px;
          z-index: 8;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          color: #f2ece1;
          opacity: 0;
          letter-spacing: 0.05em;
        }
        .wk-bottom-rule {
          position: absolute;
          left: 96px;
          right: 96px;
          bottom: 280px;
          height: 3px;
          background: rgba(242, 236, 225, 0.25);
          z-index: 8;
          transform-origin: left center;
          transform: scaleX(0);
        }
        .wk-stat-pop {
          position: absolute;
          right: 100px;
          bottom: 350px;
          z-index: 8;
          text-align: right;
          opacity: 0;
        }
        .wk-stat-pop .big {
          font-family: "JetBrains Mono", monospace;
          font-size: 80px;
          color: #ff8a1e;
          font-weight: 700;
        }
        .wk-stat-pop .small {
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          opacity: 0.7;
          letter-spacing: 0.1em;
        }
      </style>
      <div id="root" data-composition-id="sc-work" data-width="2160" data-height="3840">
        <div class="wk-bg-panel"></div>
        <div class="wk-ghost">WORK</div>
        <div class="wk-parallax" id="wk-parallax" data-layout-allow-overflow></div>

        <!-- dust motes in the light beam, deterministic positions -->
        <div class="wk-dust" id="wk-d1" style="left: 18%; top: 30%; width: 8px; height: 8px;"></div>
        <div class="wk-dust" id="wk-d2" style="left: 30%; top: 22%; width: 5px; height: 5px;"></div>
        <div class="wk-dust" id="wk-d3" style="left: 85%; top: 35%; width: 7px; height: 7px;"></div>
        <div class="wk-dust" id="wk-d4" style="left: 12%; top: 55%; width: 6px; height: 6px;"></div>

        <div class="wk-bracket tl" id="wk-bk-tl"><span class="h"></span><span class="v"></span></div>
        <div class="wk-bracket tr" id="wk-bk-tr"><span class="h"></span><span class="v"></span></div>
        <div class="wk-bracket bl" id="wk-bk-bl"><span class="h"></span><span class="v"></span></div>
        <div class="wk-bracket br" id="wk-bk-br"><span class="h"></span><span class="v"></span></div>

        <div class="wk-badge mono" id="wk-badge">FASE 02 / 06</div>
        <div class="wk-headline" id="wk-headline"><span class="line">12:00</span><span class="line accent">LAVORO</span></div>
        <div class="wk-sub mono" id="wk-sub">SCRIVANIA — TANTILLO COLORI ONLINE</div>

        <div class="wk-bezel" id="wk-bezel"></div>
        <div class="wk-scanline" id="wk-scanline"></div>
        <div class="wk-corner-tag mono wk-tag-tl" id="wk-tag-tl">● LIVE FEED</div>
        <div class="wk-corner-tag mono wk-tag-tr" id="wk-tag-tr"><span class="line">CAM 02</span><span class="line">DESK / SCREEN</span></div>

        <div class="wk-callout-line wk-line-1" id="wk-line-1"></div>
        <div class="wk-callout wk-callout-1 mono" id="wk-callout-1">e-commerce&nbsp;↑</div>
        <div class="wk-callout-line wk-line-2" id="wk-line-2"></div>
        <div class="wk-callout wk-callout-2 mono" id="wk-callout-2">piano €10K/mese</div>

        <div class="wk-bottom-rule" id="wk-bottom-rule"></div>
        <div class="wk-bottom-meta mono" id="wk-bottom-meta">PRODUTTIVITÀ · MODALITÀ FOCUS</div>
        <div class="wk-stat-pop" id="wk-stat-pop">
          <div class="big" id="wk-stat-num">€10K+</div>
          <div class="small">OBIETTIVO MENSILE</div>
        </div>

        <div class="wk-wipe" id="wk-wipe"></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Transition IN: diagonal shutter wipe (CSS sets the full-cover start state) ----
        tl.fromTo(
          "#wk-wipe",
          { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)" },
          { clipPath: "polygon(0 0, 100% 0, 100% 0%, 0 0%)", duration: 0.4, ease: "power3.inOut" },
          0,
        );

        // ---- Depth: parallax glow drifts behind the bezel, independent rate ----
        tl.fromTo(
          "#wk-parallax",
          { x: -50, opacity: 0, scale: 1 },
          { x: 50, opacity: 1, scale: 1.15, duration: 6.5, ease: "sine.inOut" },
          0,
        );

        // ---- Self-drawing bezel frame brackets ----
        const wkBrackets = ["#wk-bk-tl", "#wk-bk-tr", "#wk-bk-bl", "#wk-bk-br"];
        wkBrackets.forEach((sel, i) => {
          tl.to(`${sel} .h`, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.62 + i * 0.05);
          tl.to(`${sel} .v`, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 0.62 + i * 0.05);
        });

        // ---- Dust motes drifting in the desk-lamp beam, staggered loops ----
        const dusts = ["#wk-d1", "#wk-d2", "#wk-d3", "#wk-d4"];
        dusts.forEach((sel, i) => {
          const dur = 2.4 + (i % 3) * 0.4;
          const start = 0.4 + i * 0.5;
          tl.fromTo(sel, { opacity: 0, y: 0 }, { opacity: 0.6, duration: 0.5, ease: "sine.out" }, start);
          tl.to(sel, { y: -120 - (i % 2) * 40, x: i % 2 === 0 ? 30 : -30, opacity: 0, duration: dur, ease: "sine.inOut" }, start);
        });
        dusts.forEach((sel, i) => {
          const dur = 2.2 + (i % 3) * 0.3;
          const start = 3.4 + i * 0.5;
          tl.fromTo(sel, { opacity: 0, y: 0 }, { opacity: 0.55, duration: 0.5, ease: "sine.out", overwrite: "auto" }, start);
          tl.to(sel, { y: -100 - (i % 2) * 30, x: i % 2 === 0 ? 25 : -25, opacity: 0, duration: dur, ease: "sine.inOut", overwrite: "auto" }, start);
        });

        tl.fromTo(
          "#wk-badge",
          { opacity: 0, scale: 0.7 },
          { opacity: 0.9, scale: 1, duration: 0.4, ease: "back.out(2)" },
          0.42,
        );
        tl.fromTo(
          "#wk-headline",
          { x: -160, opacity: 0, filter: "blur(10px)" },
          { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
          0.5,
        );
        tl.fromTo("#wk-sub", { opacity: 0, y: 20 }, { opacity: 0.85, y: 0, duration: 0.4, ease: "power2.out" }, 0.78);

        tl.fromTo(
          "#wk-bezel",
          { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          0.6,
        );
        tl.fromTo("#wk-tag-tl", { opacity: 0, y: -16 }, { opacity: 0.9, y: 0, duration: 0.35, ease: "power2.out" }, 0.85);
        tl.fromTo("#wk-tag-tr", { opacity: 0, y: -16 }, { opacity: 0.9, y: 0, duration: 0.35, ease: "power2.out" }, 0.95);

        // scanline sweeps down across the bezel once, ambient
        tl.fromTo(
          "#wk-scanline",
          { y: 0, opacity: 0.7 },
          { y: 1500, duration: 2.6, ease: "none", repeat: 1 },
          1.0,
        );

        // callouts pop in staggered with connector lines
        tl.fromTo("#wk-line-1", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 1.5);
        tl.fromTo(
          "#wk-callout-1",
          { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" },
          1.62,
        );
        tl.fromTo("#wk-line-2", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 3.6);
        tl.fromTo(
          "#wk-callout-2",
          { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" },
          3.72,
        );

        tl.fromTo(
          "#wk-bottom-rule",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power3.out" },
          1.1,
        );
        tl.fromTo("#wk-bottom-meta", { opacity: 0, x: -20 }, { opacity: 0.7, x: 0, duration: 0.4, ease: "power2.out" }, 1.3);
        tl.fromTo(
          "#wk-stat-pop",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
          3.85,
        );

        // ambient ticks on tag opacity
        tl.to("#wk-tag-tl", { opacity: 0.5, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.3);

        window.__timelines["sc-work"] = tl;
      </script>
    </template>
  </body>
</html>
